<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerber Tech Cut File Reader — BIÇKIN</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="toolbar">
  <div class="brand" title="BIÇKIN — Kesim Simülatörü">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="bkGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fdba74"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#c2410c"/>
        </linearGradient>
        <clipPath id="bkClip"><circle cx="32" cy="32" r="30"/></clipPath>
      </defs>
      <circle cx="32" cy="32" r="31" fill="url(#bkGrad)"/>
      <g clip-path="url(#bkClip)" stroke="#1c1917" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
        <!-- Omuza atılmış ceket -->
        <path d="M4 66 Q6 49 20 45 L27 44 L32 58 L37 44 L44 45 Q58 49 60 66 Z" fill="#475569"/>
        <path d="M44 45 Q55 47 59 58 L52 56 Z" fill="#334155"/>
        <!-- Gömlek -->
        <path d="M27 44 L32 58 L37 44 Z" fill="#f8fafc"/>
        <!-- Kırmızı kuşak ve bıçak sapı -->
        <path d="M14 58 Q32 54 50 58 L50 66 L14 66 Z" fill="#dc2626"/>
        <path d="M36 57 L44 53" stroke-width="2.6" stroke="#a16207"/>
        <!-- Boyun ve kulaklar -->
        <path d="M27 38 L27 45 L37 45 L37 38 Z" fill="#e0a77c"/>
        <ellipse cx="20.5" cy="30" rx="2.4" ry="3.4" fill="#e0a77c"/>
        <ellipse cx="43.5" cy="30" rx="2.4" ry="3.4" fill="#e0a77c"/>
        <!-- Kafa -->
        <path d="M21 24 Q21 15 32 15 Q43 15 43 24 L43 33 Q43 44 32 45 Q21 44 21 33 Z" fill="#eab38a"/>
        <!-- Sakal -->
        <path d="M21 31 Q21 47 32 48 Q43 47 43 31 Q41 39 32 39 Q23 39 21 31 Z" fill="#3f2a1d"/>
        <!-- Çatık kaşlar ve gözler -->
        <path d="M24 24.5 L30.5 26.5" stroke-width="2.8"/>
        <path d="M40 24.5 L33.5 26.5" stroke-width="2.8"/>
        <circle cx="27.5" cy="28.6" r="1.1" fill="#1c1917" stroke="none"/>
        <circle cx="36.5" cy="28.6" r="1.1" fill="#1c1917" stroke="none"/>
        <!-- Kalın burun -->
        <path d="M31 28 Q29 33 30 34 Q32 35.5 34 34 Q35 33 33 28" fill="#d9946a" stroke-width="1.2"/>
        <!-- Burma bıyık -->
        <path d="M32 35.5 C27 33 21 34 18.5 37.5 C17 39.5 13.5 38.5 14.5 34.5 C15.5 32 18 33 17.5 35"
              fill="none" stroke="#1c1917" stroke-width="3.2"/>
        <path d="M32 35.5 C37 33 43 34 45.5 37.5 C47 39.5 50.5 38.5 49.5 34.5 C48.5 32 46 33 46.5 35"
              fill="none" stroke="#1c1917" stroke-width="3.2"/>
        <!-- Fes (hafif yana yatık) ve püskül -->
        <g transform="rotate(8 32 14)">
          <path d="M21.5 19 L24 5 L40 5 L42.5 19 Q32 21.5 21.5 19 Z" fill="#b91c1c"/>
          <path d="M22.3 15 Q32 17.5 41.8 15" fill="none" stroke="#7f1d1d" stroke-width="1.4"/>
          <path d="M32 5 Q40 4 44 9 Q46 12 45 16" fill="none" stroke-width="1.8"/>
          <path d="M45 15 L43.5 20 M45 15 L45.5 20.5 M45 15 L47 19.5" stroke-width="1.3"/>
        </g>
      </g>
      <circle cx="32" cy="32" r="31" fill="none" stroke="#7c2d12" stroke-width="1.5"/>
    </svg>
    <span>BIÇKIN</span>
  </div>
  <label class="btn primary" data-i18n-title="file.open.title">
    <span data-i18n="file.open">📂 Dosya Seç</span>
    <input type="file" id="fileInput" multiple accept=".cut,.CUT,.plt,.PLT,.hpgl,.hpg,.dxf,.DXF,.txt,*/*">
  </label>
  <label class="field" data-i18n-title="start.title">
    <span data-i18n="start">Başlangıç</span>
    <select id="startPiece" disabled><option value="" data-i18n="start.all">Tümü (baştan)</option></select>
  </label>
  <label class="field" data-i18n-title="only.title">
    <input type="checkbox" id="onlyPiece" disabled> <span data-i18n="only">Sadece bu parça</span>
  </label>
  <button class="btn" id="btnSim" disabled>▶ Simüle Et</button>
  <label class="field" data-i18n-title="speed.title">
    <span data-i18n="speed">Hız (mm/sn)</span>
    <input type="number" id="speed" min="1" max="1000000" step="1" value="500">
  </label>
  <button class="btn" id="btnPause" disabled data-i18n="pause">⏸ Duraklat</button>
  <button class="btn" id="btnStop" disabled data-i18n="stop">⏹ Durdur</button>
  <button class="btn" id="btnReset" data-i18n="reset" data-i18n-title="reset.title">⟲ Reset</button>
  <span class="nest-wrap">
    <button class="btn" id="btnPieces" disabled data-i18n-title="nest.btn.title">☰ <span data-i18n="nest.btn">Parçalar</span> <b id="nestCount"></b></button>
    <div class="popover" id="nestPanel" hidden>
      <p class="muted" data-i18n="nest.hint"></p>
      <div class="nest-actions">
        <button type="button" class="linkbtn" id="nestAll" data-i18n="nest.all">Tümünü seç</button>
        <button type="button" class="linkbtn" id="nestNone" data-i18n="nest.none">Temizle</button>
        <label class="field"><input type="checkbox" id="nestRotate" checked> <span data-i18n="nest.rotate">180° çevirmeye izin ver</span></label>
      </div>
      <div class="nest-list" id="nestList"></div>
    </div>
  </span>
  <span class="sep"></span>
  <span id="fileName" data-i18n="file.none">Dosya seçilmedi</span>
  <span class="toolbar-right">
    <button class="btn guide" id="btnGuide" data-i18n="guide.btn" data-i18n-title="guide.btn.title">📘 Kullanım Kılavuzu</button>
    <button class="btn" id="btnFeedback" data-i18n="fb.btn" data-i18n-title="fb.btn.title">💬 Geri Bildirim</button>
    <button class="btn version" id="btnVersion" data-i18n-title="ver.btn.title">Versiyon</button>
    <span class="lang" role="group" aria-label="Dil / Language">
      <button type="button" data-lang="tr" title="Türkçe">TR</button><button type="button" data-lang="en" title="English">EN</button>
    </span>
  </span>
</header>

<div class="bar">
  <span class="title" data-i18n="bar.marker">Pastal</span>
  <span id="markerInfo">—</span>
</div>
<div class="bar">
  <span class="title" data-i18n="bar.tools">Araçlar</span>
  <span class="tools" id="toolList"></span>
  <span class="right"><button class="linkbtn" id="btnToolReset" data-i18n="tools.reset" data-i18n-title="tools.reset.title">Varsayılan renkler</button></span>
</div>
<div id="previewWrap"><canvas id="preview"></canvas></div>

<div class="bar">
  <span class="title" data-i18n="bar.sim">Simülasyon</span>
  <span><span class="knife-dot" id="knifeDot"></span><b id="knifeState">—</b></span>
  <span><span data-i18n="pos">Konum:</span> <b id="pos">—</b></span>
  <span><span data-i18n="piece">Parça:</span> <b id="pieceInfo">—</b></span>
  <span><span data-i18n="time">Süre:</span> <b id="timeInfo">—</b></span>
  <span class="progress"><div id="progressBar"></div></span>
  <b id="progressPct">0%</b>
  <span class="right">
    <span class="legend" data-i18n-title="legend.title">
      <span><i style="color:#15803d">&gt;</i> <span data-i18n="legend.cw">saat yönü</span></span>
      <span><i style="color:#9333ea">&lt;</i> <span data-i18n="legend.ccw">saat yönü tersi</span></span>
      <span><i style="color:#000;background:#f7f3ea;padding:0 3px;border-radius:2px">●</i> <span data-i18n="legend.start">başlangıç</span></span>
    </span>
    <label class="field"><input type="checkbox" id="showDir" checked> <span data-i18n="showDir">Yön ikonları</span></label>
    <label class="field"><input type="checkbox" id="follow" checked> <span data-i18n="follow">Bıçağı takip et</span></label>
    <button class="btn" id="btnFit" disabled data-i18n="fit">⤢ Sığdır</button>
  </span>
</div>
<div id="simWrap"><canvas id="sim"></canvas></div>

<footer>
  <div class="bar">
    <span class="title" data-i18n="bar.log">İşlemler</span>
    <span id="logCounts"></span>
    <span class="right"><button class="linkbtn" id="btnClearLog" data-i18n="log.clear">Temizle</button></span>
  </div>
  <div id="log"></div>
</footer>

<dialog id="verDialog" class="modal">
  <div class="modal-head">
    <h2 data-i18n="ver.heading">Versiyon geçmişi</h2>
    <button type="button" class="btn" data-close data-i18n="dlg.close">Kapat</button>
  </div>
  <div class="modal-body">
    <p class="muted" data-i18n="ver.intro"></p>
    <div id="verList"></div>
  </div>
</dialog>

<dialog id="guideDialog" class="modal wide">
  <div class="modal-head">
    <h2 data-i18n="guide.heading">Kullanım kılavuzu</h2>
    <button type="button" class="btn" data-close data-i18n="dlg.close">Kapat</button>
  </div>
  <div class="modal-body" id="guideBody"></div>
</dialog>

<dialog id="fbDialog">
  <form method="dialog" id="fbForm">
    <h2 data-i18n="fb.heading">Geri bildirim gönder</h2>
    <p class="muted" data-i18n="fb.intro"></p>
    <label class="fb-row"><span data-i18n="fb.type">Tür</span>
      <select id="fbType">
        <option value="bug" data-i18n="fb.type.bug">Hata bildirimi</option>
        <option value="enhancement" data-i18n="fb.type.feature">Özellik isteği</option>
        <option value="question" data-i18n="fb.type.question">Soru</option>
      </select>
    </label>
    <label class="fb-row"><span data-i18n="fb.title">Başlık</span>
      <input type="text" id="fbTitle" maxlength="200" data-i18n-ph="fb.title.ph">
    </label>
    <label class="fb-row"><span data-i18n="fb.body">Açıklama</span>
      <textarea id="fbBody" rows="7" data-i18n-ph="fb.body.ph"></textarea>
    </label>
    <label class="fb-check"><input type="checkbox" id="fbDiag" checked> <span data-i18n="fb.diag"></span></label>
    <p class="fb-err" id="fbErr"></p>
    <div class="fb-actions">
      <button type="button" class="btn" id="fbCancel" data-i18n="fb.cancel">Vazgeç</button>
      <button type="button" class="btn primary" id="fbSend" data-i18n="fb.send">GitHub'da gönder ↗</button>
    </div>
  </form>
</dialog>

<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/app/01-config.js"></script>
<script src="js/app/02-core.js"></script>
<script src="js/app/03-log.js"></script>
<script src="js/app/04-tables.js"></script>
<script src="js/app/05-tools.js"></script>
<script src="js/app/06-parse-plt.js"></script>
<script src="js/app/07-parse-dxf.js"></script>
<script src="js/app/08-parse-cut.js"></script>
<script src="js/app/09-state.js"></script>
<script src="js/app/10-load.js"></script>
<script src="js/app/11-view-data.js"></script>
<script src="js/app/12-controls.js"></script>
<script src="js/app/13-draw.js"></script>
<script src="js/app/14-preview.js"></script>
<script src="js/app/15-simview.js"></script>
<script src="js/app/16-nesting.js"></script>
<script src="js/app/17-version.js"></script>
<script src="js/app/18-guide.js"></script>
<script src="js/app/19-lang.js"></script>
<script src="js/app/20-boot.js"></script>
</body>
</html>
